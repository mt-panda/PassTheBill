name: EAS Update

on:
  push:
    branches: [master]
    paths-ignore:
      - 'supabase/**'
      - '**.md'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: eas update --channel production --environment production --message "$MESSAGE" --non-interactive
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
