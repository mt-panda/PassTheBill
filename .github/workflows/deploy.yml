name: Publish OTA update

on:
  push:
    branches: [master]
    paths-ignore:
      - 'supabase/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      native_build:
        description: 'Build a new Android APK before publishing the update'
        required: true
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MESSAGE: ${{ github.event.head_commit.message || 'Manual deploy' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build Android APK
        if: github.event_name == 'workflow_dispatch' && inputs.native_build == true
        run: eas build --profile production --platform android --non-interactive --wait --message "$MESSAGE"

      - name: Publish OTA update
        run: eas update --channel production --environment production --non-interactive --message "$MESSAGE"
